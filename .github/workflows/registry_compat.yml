name: Registry Compatibility

# Plugin-vs-core dependency check. For every plugin manifest in the catalog,
# fetch the plugin's pyproject from its tagged ref and verify its dependency
# specifiers still admit the versions cuvis-ai-core locks. Catches upstream
# constraint drift (P13) at PR time instead of at first pipeline run.

on:
  push:
    branches: [main, staging]
    paths: ["configs/plugins/**"]
  pull_request:
    branches: [main, staging]
    paths: ["configs/plugins/**"]

concurrency:
  group: registry-compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # cuvis-ai-core ref to fetch the audit script + uv.lock from. Pin to a release
  # tag once the audit ships in a tagged cuvis-ai-core release.
  CORE_REF: main

jobs:
  registry-compat:
    name: Audit plugin manifests against core lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Fetch audit script + core lock from cuvis-ai-core
        run: |
          base="https://raw.githubusercontent.com/cubert-hyperspectral/cuvis-ai-core/${CORE_REF}"
          mkdir -p core
          curl -fsSL "${base}/scripts/audit_plugin_deps.py" -o audit_plugin_deps.py
          curl -fsSL "${base}/uv.lock" -o core/uv.lock

      - name: Fetch each git plugin's pyproject by tag
        run: >
          uv run --no-project --python 3.11 --with pyyaml
          python scripts/fetch_plugin_pyprojects.py

      - name: Audit plugin manifests against the core lock
        run: >
          uv run --no-project --python 3.11 --with click --with packaging --with pyyaml
          python audit_plugin_deps.py
          --check plugins
          --plugins-dir configs/plugins
          --against-core core
          --strict
