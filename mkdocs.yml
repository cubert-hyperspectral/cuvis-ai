# MkDocs Configuration for cuvis-ai
site_name: Cuvis.AI
site_description: PyTorch Lightning Training Pipeline for Hyperspectral Data Analysis
site_author: Cubert GmbH
site_url: https://docs.cuvis.ai/

# Repository
repo_name: cubert-hyperspectral/cuvis-ai
repo_url: https://github.com/cubert-hyperspectral/cuvis-ai
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025-2026 Cubert GmbH

# Configuration
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  logo: images/logo.png
  favicon: images/logo.png
  icon:
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: cubert-hyperspectral
      repo: cuvis-ai
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - macros:
      module_name: scripts/docs_macros
  - llmstxt:
      markdown_description: |
        Cuvis.AI is an open-source, extensible framework for building AI-powered
        processing pipelines for hyperspectral video data. It lets you process
        and structure spectral data, train and apply machine learning models,
        visualize and interpret results, and deploy applications in real-time
        environments. Pipelines are built from reusable modular nodes and can
        be extended with custom plugins or external integrations. Cuvis.AI
        bridges the gap between hyperspectral hardware and real-world
        applications, enabling faster development, testing, and deployment of
        new solutions.
      full_output: llms-full.txt
      sections:
        Get Started:
          - get-started/*.md
        Concepts:
          - concepts/*.md
        Tutorials:
          - tutorials/**/*.md
        Catalogs:
          - catalogs/nodes/*.md
          - catalogs/datasets/*.md
        Workflows:
          - workflows/*.md
        Agentic Integration:
          - agentic-integration/*.md
        Deployment:
          - deployment/**/*.md
        Reference:
          - reference/**/*.md
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            separate_signature: true
            merge_init_into_class: true
            show_if_no_docstring: false
            members_order: source
            filters:
              - "!^_"
              - "^__init__$"

