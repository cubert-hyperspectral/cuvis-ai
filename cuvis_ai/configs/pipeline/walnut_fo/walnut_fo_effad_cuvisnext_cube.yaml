metadata:
  name: walnut_fo_effad_cuvisnext_cube
  description: 'Ungated EfficientAD walnut FO heatmap, for screenshots and inspection:
    CIR 870/640/550 -> JointPercentileStretch -> EfficientAD-512 (CIR, anomalib 2.1.0,
    seed 0) -> norm_effad (34 clean VAL frames) -> effad_map, the map on every frame,
    no gate. Nodes, hparams and fitted state are the OR pipeline''s (walnut_fo_multiscale_effad_or_gated),
    so the map equals its norm_effad map bit for bit. Display effad_map.scores; 0-3
    is the report''s colour scale. The EfficientAD alarm at the 22-Sep stand: frame
    score (mean of the top 0.1 % pixels) > 1.9587.'
  created: ''
  tags:
  - anomaly
  - efficientad
  - hyperspectral
  - split_v3
  - ungated
  - walnut
  author: raj@cubert-gmbh.de
  cuvis_ai_version: 0.12.0
plugins:
- cuvis_ai_builtin
- patchcore
- steervit
- efficientad
nodes:
- name: cu3s_data
  class_name: cuvis_ai.node.data.CU3SDataNode
  hparams: {}
- name: cir_870_640_550
  class_name: cuvis_ai.node.channel_selector.FixedWavelengthSelector
  hparams:
    target_wavelengths:
    - 870.0
    - 640.0
    - 550.0
    normalize_output: false
- name: stretch
  class_name: cuvis_ai_steervit.node.stretch.JointPercentileStretch
  hparams:
    low: 2.0
    high: 98.0
    per_channel: false
    quantize_levels: 255
    eps: 1.0e-06
- name: effad
  class_name: cuvis_ai_efficientad.node.efficientad.EfficientAdDetector
  hparams:
    image_size:
    - 512
    - 512
    teacher_out_channels: 384
    model_size: small
    padding: false
    pad_maps: true
    topk_frac: 0.001
- name: norm_effad
  class_name: cuvis_ai_patchcore.node.calibration.ScoreRangeNormalizer
  hparams:
    n_channels: 1
    low: 1.0
    high: 99.0
    floor: true
    fit_subsample: 4
    max_fit_values: 4000000
    seed: 0
    eps: 1.0e-09
- name: effad_map
  class_name: cuvis_ai_patchcore.node.fusion.ScoreMapFusion
  hparams:
    mode: mean
    weights: null
connections:
- source: cu3s_data.outputs.cube
  target: cir_870_640_550.inputs.cube
- source: cu3s_data.outputs.wavelengths
  target: cir_870_640_550.inputs.wavelengths
- source: cir_870_640_550.outputs.rgb_image
  target: stretch.inputs.data
- source: stretch.outputs.normalized
  target: effad.inputs.rgb_image
- source: effad.outputs.scores
  target: norm_effad.inputs.scores
- source: norm_effad.outputs.normalized
  target: effad_map.inputs.scores
