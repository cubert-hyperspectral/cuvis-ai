metadata:
  name: walnut_fo_twobank_featgated_cuvisnext_cube
  description: 'Combined: alarm on the CIR SteerViT feature bank (norm_steervit, the
    robust frame alarm), display the two-bank fusion heatmap (fuse, best localisation).
    FrameScoreGate passes the fusion map only on frames whose feature-bank top-0.1%
    score clears threshold; clean frames are blanked. Reuses the two-bank .pt (gate
    is stateless). Default threshold 1.731 = 95th pct of all 50 known clean frames
    (deploy scale); catches 100% of NEW fakes/hands/15-Sep and 89% of OLD FO at 0%
    OLD-clean false alarms, but the 1-Sep session drifts hot (its clean product
    reaches 1.96) so ~43% of 1-Sep clean false-alarms at this fixed value - it is an
    hparam, tune per session on the session own clean frames. cuvis.next cube mode.'
  created: ''
  tags:
  - anomaly
  - hyperspectral
  - walnut
  - patchcore
  - steervit
  - fusion
  - split_v2
  - cuvisnext
  - combined
  author: raj@cubert-gmbh.de
  cuvis_ai_version: 0.10.0
plugins:
- cuvis_ai_builtin
- patchcore
- steervit
nodes:
- name: cu3s_data
  class_name: cuvis_ai.node.data.CU3SDataNode
  hparams: {}
- name: patchcore_hsi
  class_name: cuvis_ai_patchcore.node.patchcore.PatchCoreDetector
  hparams:
    input_channels: 61
    coreset_size: 8000
    stride: 4
    bank_stride: 4
    pool_size: 1
    max_bank_size: 300000
    topk_frac: 0.001
    chunk_size: 4096
    autocast_dtype: null
    standardize: true
    seed: 0
    eps: 1.0e-06
    coreset_projection: null
    projection_eps: 0.9
- name: rgb_640_550_470
  class_name: cuvis_ai.node.channel_selector.FixedWavelengthSelector
  hparams:
    target_wavelengths:
    - 870.0
    - 640.0
    - 550.0
    normalize_output: false
- name: stretch
  class_name: cuvis_ai_steervit.node.stretch.JointPercentileStretch
  hparams:
    low: 2.0
    high: 98.0
    per_channel: false
    quantize_levels: 255
    eps: 1.0e-06
- name: steervit
  class_name: cuvis_ai_steervit.node.steervit.SteerViTExtractor
  hparams:
    checkpoint: steervit_dinov2_base.pth
    hf_repo: JonaRuthardt/SteerViT
    prompts:
    - the anomaly in the walnuts
    feature_prompt: the anomaly in the walnuts
    topk_frac: 0.001
    score_activation: sigmoid
- name: patchcore_steervit
  class_name: cuvis_ai_patchcore.node.patchcore.PatchCoreDetector
  hparams:
    input_channels: 768
    coreset_size: 7200
    stride: 1
    bank_stride: 1
    pool_size: 1
    max_bank_size: 80000
    topk_frac: 0.001
    chunk_size: 4096
    autocast_dtype: null
    standardize: false
    seed: 0
    eps: 1.0e-06
    coreset_projection: null
    projection_eps: 0.9
- name: norm_hsi
  class_name: cuvis_ai_patchcore.node.calibration.ScoreRangeNormalizer
  hparams:
    n_channels: 1
    low: 1.0
    high: 99.0
    floor: true
    fit_subsample: 4
    max_fit_values: 4000000
    seed: 0
    eps: 1.0e-09
- name: norm_steervit
  class_name: cuvis_ai_patchcore.node.calibration.ScoreRangeNormalizer
  hparams:
    n_channels: 1
    low: 1.0
    high: 99.0
    floor: true
    fit_subsample: 4
    max_fit_values: 4000000
    seed: 0
    eps: 1.0e-09
- name: fuse
  class_name: cuvis_ai_patchcore.node.fusion.ScoreMapFusion
  hparams:
    mode: mean
    weights: null
- name: gate
  class_name: cuvis_ai_patchcore.node.gate.FrameScoreGate
  hparams:
    threshold: 1.731
    topk_frac: 0.001
    mode: heatmap
    mask_threshold: null
    log_scores: true
connections:
- source: cu3s_data.outputs.cube
  target: patchcore_hsi.inputs.cube
- source: cu3s_data.outputs.cube
  target: rgb_640_550_470.inputs.cube
- source: cu3s_data.outputs.wavelengths
  target: rgb_640_550_470.inputs.wavelengths
- source: cu3s_data.outputs.cube
  target: patchcore_steervit.inputs.reference
- source: patchcore_hsi.outputs.scores
  target: norm_hsi.inputs.scores
- source: rgb_640_550_470.outputs.rgb_image
  target: stretch.inputs.data
- source: stretch.outputs.normalized
  target: steervit.inputs.rgb_image
- source: steervit.outputs.features
  target: patchcore_steervit.inputs.cube
- source: patchcore_steervit.outputs.scores
  target: norm_steervit.inputs.scores
- source: norm_hsi.outputs.normalized
  target: fuse.inputs.scores
- source: norm_steervit.outputs.normalized
  target: fuse.inputs.scores
- source: fuse.outputs.scores
  target: gate.inputs.scores
- source: norm_steervit.outputs.normalized
  target: gate.inputs.alarm_scores
