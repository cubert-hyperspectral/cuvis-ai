metadata:
  name: walnut_fo_multiscale_gmm_or_gated_fp16trt_cuvisnext_cube
  description: 'OR-gated walnut FO detector with a spectral branch (replaces EfficientAD).
    Multi-scale t1+t2 feature banks -> fuse -> gate, OR fused -> gate_fused: fused
    = soft minimum (beta 10) of the multi-scale map (ms_norm) and a Gaussian-mixture
    map (mix_norm), each on the 1-99 % range of the 34 clean VAL frames. Mixture:
    the 61-band spectra of every 4th pixel (mix_grid), SNV (mix_snv), a 32-component
    full-covariance Gaussian mixture fitted on the 200 v3 TRAIN frames (mix_gmm; negative
    log-likelihood), bilinear back to the cube (mix_up). Display = the fused gated
    map when gate_fused opens, else the multi-scale gated map (ScoreMapFusion first;
    zeros when neither passes); FO mask: display_mask.decisions (DecisionFusion first,
    same order). Ungated inspection maps: fused_map.scores, mixture_map.scores. Thresholds:
    max clean x 1.10 per gate, set per session with calibrate_live.py --pipeline gmm_or
    (a pooled threshold misses fakes on another day). The mixture runs in float32
    with TF32 off. Speed variant: float16 autocast on SteerViT and PatchCore (cuvis-ai-steervit
    and cuvis-ai-patchcore >= 0.2.0); the threshold is calibrated for this variant.'
  created: ''
  tags:
  - anomaly
  - gaussian_mixture
  - hyperspectral
  - multiscale
  - or_gate
  - patchcore
  - snv
  - split_v3
  - steervit
  - walnut
  author: raj@cubert-gmbh.de
  cuvis_ai_version: 0.12.0
plugins:
- cuvis_ai_builtin
- patchcore
- steervit
nodes:
- name: cu3s_data
  class_name: cuvis_ai.node.data.CU3SDataNode
  hparams: {}
- name: cir_870_640_550
  class_name: cuvis_ai.node.channel_selector.FixedWavelengthSelector
  hparams:
    target_wavelengths:
    - 870.0
    - 640.0
    - 550.0
    normalize_output: false
- name: stretch
  class_name: cuvis_ai_steervit.node.stretch.JointPercentileStretch
  hparams:
    low: 2.0
    high: 98.0
    per_channel: false
    quantize_levels: 255
    eps: 1.0e-06
- name: steervit_t1
  class_name: cuvis_ai_steervit.node.steervit.SteerViTExtractor
  hparams:
    backend: tensorrt
    engine_dir: D:/walnuts/walnut_fo_stack/trt_engines/steervit
    checkpoint: steervit_dinov2_base.pth
    hf_repo: JonaRuthardt/SteerViT
    prompts:
    - the anomaly in the walnuts
    topk_frac: 0.001
    score_activation: sigmoid
    autocast_dtype: float16
- name: patchcore_t1
  class_name: cuvis_ai_patchcore.node.patchcore.PatchCoreDetector
  hparams:
    input_channels: 768
    coreset_size: 7200
    stride: 1
    bank_stride: 1
    pool_size: 1
    max_bank_size: 80000
    topk_frac: 0.001
    chunk_size: 4096
    autocast_dtype: float16
    standardize: false
    seed: 0
    eps: 1.0e-06
    coreset_projection: null
    projection_eps: 0.9
- name: tiler_t2
  class_name: cuvis_ai_steervit.node.tiling.ImageTiler
  hparams:
    tiles: 2
- name: steervit_t2
  class_name: cuvis_ai_steervit.node.steervit.SteerViTExtractor
  hparams:
    backend: tensorrt
    engine_dir: D:/walnuts/walnut_fo_stack/trt_engines/steervit
    checkpoint: steervit_dinov2_base.pth
    hf_repo: JonaRuthardt/SteerViT
    prompts:
    - the anomaly in the walnuts
    topk_frac: 0.001
    score_activation: sigmoid
    autocast_dtype: float16
- name: stitch_t2
  class_name: cuvis_ai_steervit.node.tiling.GridStitcher
  hparams:
    tiles: 2
- name: patchcore_t2
  class_name: cuvis_ai_patchcore.node.patchcore.PatchCoreDetector
  hparams:
    input_channels: 768
    coreset_size: 7200
    stride: 1
    bank_stride: 1
    pool_size: 1
    max_bank_size: 80000
    topk_frac: 0.001
    chunk_size: 4096
    autocast_dtype: float16
    standardize: false
    seed: 0
    eps: 1.0e-06
    coreset_projection: null
    projection_eps: 0.9
- name: norm_t1
  class_name: cuvis_ai_patchcore.node.calibration.ScoreRangeNormalizer
  hparams:
    n_channels: 1
    low: 1.0
    high: 99.0
    floor: true
    fit_subsample: 4
    max_fit_values: 4000000
    seed: 0
    eps: 1.0e-09
- name: norm_t2
  class_name: cuvis_ai_patchcore.node.calibration.ScoreRangeNormalizer
  hparams:
    n_channels: 1
    low: 1.0
    high: 99.0
    floor: true
    fit_subsample: 4
    max_fit_values: 4000000
    seed: 0
    eps: 1.0e-09
- name: fuse
  class_name: cuvis_ai_patchcore.node.fusion.ScoreMapFusion
  hparams:
    mode: mean
    weights: null
- name: ms_norm
  class_name: cuvis_ai_patchcore.node.calibration.ScoreRangeNormalizer
  hparams:
    n_channels: 1
    low: 1.0
    high: 99.0
    floor: true
    fit_subsample: 4
    max_fit_values: 4000000
    seed: 0
    eps: 1.0e-09
- name: mix_grid
  class_name: cuvis_ai_patchcore.node.spatial.GridSubsample
  hparams:
    stride: 4
- name: mix_snv
  class_name: cuvis_ai.node.pretreatments.snv.SNVCorrection
  hparams:
    eps: 1.0e-08
- name: mix_gmm
  class_name: cuvis_ai.node.clustering.gmm.GaussianMixtureClusterer
  hparams:
    n_components: 32
    covariance_type: full
    reg_covar: 0.001
    max_iter: 300
    n_init: 1
    random_state: 0
    max_fit_pixels: 400000
    fit_seed: 0
- name: mix_up
  class_name: cuvis_ai_patchcore.node.spatial.ScoreUpsample
  hparams:
    mode: bilinear
- name: mix_norm
  class_name: cuvis_ai_patchcore.node.calibration.ScoreRangeNormalizer
  hparams:
    n_channels: 1
    low: 1.0
    high: 99.0
    floor: true
    fit_subsample: 4
    max_fit_values: 4000000
    seed: 0
    eps: 1.0e-09
    invert: true
- name: fused
  class_name: cuvis_ai_patchcore.node.fusion.ScoreMapFusion
  hparams:
    mode: softmin
    weights: null
    beta: 10.0
- name: gate_fused
  class_name: cuvis_ai_patchcore.node.gate.FrameScoreGate
  hparams:
    threshold: 1.1322
    mask_threshold: 1.173
    topk_frac: 0.001
    mode: heatmap
    log_scores: true
- name: gate
  class_name: cuvis_ai_patchcore.node.gate.FrameScoreGate
  hparams:
    threshold: 1.35
    mask_threshold: 1.35
    topk_frac: 0.001
    mode: heatmap
    log_scores: true
- name: display
  class_name: cuvis_ai_patchcore.node.fusion.ScoreMapFusion
  hparams:
    mode: first
    weights: null
- name: display_mask
  class_name: cuvis_ai_patchcore.node.fusion.DecisionFusion
  hparams:
    mode: first
- name: fused_map
  class_name: cuvis_ai_patchcore.node.fusion.ScoreMapFusion
  hparams:
    mode: mean
    weights: null
- name: mixture_map
  class_name: cuvis_ai_patchcore.node.fusion.ScoreMapFusion
  hparams:
    mode: mean
    weights: null
connections:
- source: cu3s_data.outputs.cube
  target: cir_870_640_550.inputs.cube
- source: cu3s_data.outputs.wavelengths
  target: cir_870_640_550.inputs.wavelengths
- source: cu3s_data.outputs.cube
  target: patchcore_t1.inputs.reference
- source: cu3s_data.outputs.cube
  target: patchcore_t2.inputs.reference
- source: cir_870_640_550.outputs.rgb_image
  target: stretch.inputs.data
- source: stretch.outputs.normalized
  target: steervit_t1.inputs.rgb_image
- source: stretch.outputs.normalized
  target: tiler_t2.inputs.image
- source: steervit_t1.outputs.features
  target: patchcore_t1.inputs.cube
- source: patchcore_t1.outputs.scores
  target: norm_t1.inputs.scores
- source: tiler_t2.outputs.tiles
  target: steervit_t2.inputs.rgb_image
- source: steervit_t2.outputs.features
  target: stitch_t2.inputs.tiles
- source: stitch_t2.outputs.grid
  target: patchcore_t2.inputs.cube
- source: patchcore_t2.outputs.scores
  target: norm_t2.inputs.scores
- source: norm_t1.outputs.normalized
  target: fuse.inputs.scores
- source: norm_t2.outputs.normalized
  target: fuse.inputs.scores
- source: fuse.outputs.scores
  target: ms_norm.inputs.scores
- source: cu3s_data.outputs.cube
  target: mix_grid.inputs.cube
- source: mix_grid.outputs.cube
  target: mix_snv.inputs.cube
- source: mix_snv.outputs.cube
  target: mix_gmm.inputs.cube
- source: mix_gmm.outputs.scores
  target: mix_up.inputs.scores
- source: cu3s_data.outputs.cube
  target: mix_up.inputs.reference
- source: mix_up.outputs.scores
  target: mix_norm.inputs.scores
- source: ms_norm.outputs.normalized
  target: fused.inputs.scores
- source: mix_norm.outputs.normalized
  target: fused.inputs.scores
- source: fused.outputs.scores
  target: gate_fused.inputs.scores
- source: fuse.outputs.scores
  target: gate.inputs.scores
- source: gate_fused.outputs.scores
  target: display.inputs.scores
- source: gate.outputs.scores
  target: display.inputs.scores
- source: gate_fused.outputs.decisions
  target: display_mask.inputs.decisions
- source: gate.outputs.decisions
  target: display_mask.inputs.decisions
- source: fused.outputs.scores
