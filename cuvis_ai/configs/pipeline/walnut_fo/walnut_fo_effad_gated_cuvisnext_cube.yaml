metadata:
  name: walnut_fo_effad_gated_cuvisnext_cube
  description: 'Gated EfficientAD walnut FO detector: CIR 870/640/550 -> JointPercentileStretch
    -> EfficientAD-512 (CIR, anomalib 2.1.0, seed 0) -> norm_effad (34 clean VAL frames)
    -> gate_effad (threshold 1.9587): the map only on frames whose frame score (mean
    of the top 0.1 % pixels) exceeds the threshold, zeros otherwise. The OR pipeline''s
    EfficientAD half alone (walnut_fo_multiscale_effad_or_gated): nodes, hparams,
    fitted state and threshold are the OR''s, so gate_effad equals the OR''s gate_effad
    bit for bit. Display gate_effad.scores. Threshold: max clean x 1.10, set per session
    with calibrate_live.py --pipeline or (it writes gate_effad here and in the OR
    yaml).'
  created: ''
  tags:
  - anomaly
  - efficientad
  - gated
  - hyperspectral
  - split_v3
  - walnut
  author: raj@cubert-gmbh.de
  cuvis_ai_version: 0.12.0
plugins:
- cuvis_ai_builtin
- patchcore
- steervit
- efficientad
nodes:
- name: cu3s_data
  class_name: cuvis_ai.node.data.CU3SDataNode
  hparams: {}
- name: cir_870_640_550
  class_name: cuvis_ai.node.channel_selector.FixedWavelengthSelector
  hparams:
    target_wavelengths:
    - 870.0
    - 640.0
    - 550.0
    normalize_output: false
- name: stretch
  class_name: cuvis_ai_steervit.node.stretch.JointPercentileStretch
  hparams:
    low: 2.0
    high: 98.0
    per_channel: false
    quantize_levels: 255
    eps: 1.0e-06
- name: effad
  class_name: cuvis_ai_efficientad.node.efficientad.EfficientAdDetector
  hparams:
    image_size:
    - 512
    - 512
    teacher_out_channels: 384
    model_size: small
    padding: false
    pad_maps: true
    topk_frac: 0.001
- name: norm_effad
  class_name: cuvis_ai_patchcore.node.calibration.ScoreRangeNormalizer
  hparams:
    n_channels: 1
    low: 1.0
    high: 99.0
    floor: true
    fit_subsample: 4
    max_fit_values: 4000000
    seed: 0
    eps: 1.0e-09
- name: gate_effad
  class_name: cuvis_ai_patchcore.node.gate.FrameScoreGate
  hparams:
    threshold: 1.9587
    topk_frac: 0.001
    mode: heatmap
    mask_threshold: null
    log_scores: true
    smooth_k: 1
connections:
- source: cu3s_data.outputs.cube
  target: cir_870_640_550.inputs.cube
- source: cu3s_data.outputs.wavelengths
  target: cir_870_640_550.inputs.wavelengths
- source: cir_870_640_550.outputs.rgb_image
  target: stretch.inputs.data
- source: stretch.outputs.normalized
  target: effad.inputs.rgb_image
- source: effad.outputs.scores
  target: norm_effad.inputs.scores
- source: norm_effad.outputs.normalized
  target: gate_effad.inputs.scores
