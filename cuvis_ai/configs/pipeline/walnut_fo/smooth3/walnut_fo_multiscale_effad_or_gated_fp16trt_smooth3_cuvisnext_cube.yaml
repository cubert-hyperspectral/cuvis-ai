metadata:
  name: walnut_fo_multiscale_effad_or_gated_fp16trt_smooth3_cuvisnext_cube
  description: 'Gate-smoothing variant of walnut_fo_multiscale_effad_or_gated_fp16trt_cuvisnext_cube: every FrameScoreGate decides on the median of its last 3 frame scores (smooth_k 3), so a one-frame spike or dip does not flip it; it reacts about 1 frame(s) later. Otherwise identical to walnut_fo_multiscale_effad_or_gated_fp16trt_cuvisnext_cube: nodes, connections, weights (.pt hardlink), thresholds (calibrate_live.py writes both) and TensorRT engines.'
  created: ''
  tags:
  - anomaly
  - efficientad
  - hyperspectral
  - multiscale
  - or_gate
  - patchcore
  - split_v3
  - steervit
  - walnut
  author: raj@cubert-gmbh.de
  cuvis_ai_version: 0.12.0
plugins:
- cuvis_ai_builtin
- patchcore
- steervit
- steervit_trt
- efficientad
- efficientad_trt
nodes:
- name: cu3s_data
  class_name: cuvis_ai.node.data.CU3SDataNode
  hparams: {}
- name: cir_870_640_550
  class_name: cuvis_ai.node.channel_selector.FixedWavelengthSelector
  hparams:
    target_wavelengths:
    - 870.0
    - 640.0
    - 550.0
    normalize_output: false
- name: stretch
  class_name: cuvis_ai_steervit.node.stretch.JointPercentileStretch
  hparams:
    low: 2.0
    high: 98.0
    per_channel: false
    quantize_levels: 255
    eps: 1.0e-06
- name: steervit_t1
  class_name: cuvis_ai_steervit.node.steervit.SteerViTExtractor
  hparams:
    backend: tensorrt
    engine_dir: D:/walnuts/walnut_fo_stack/trt_engines/steervit
    checkpoint: steervit_dinov2_base.pth
    hf_repo: JonaRuthardt/SteerViT
    prompts:
    - the anomaly in the walnuts
    topk_frac: 0.001
    score_activation: sigmoid
    autocast_dtype: float16
- name: patchcore_t1
  class_name: cuvis_ai_patchcore.node.patchcore.PatchCoreDetector
  hparams:
    input_channels: 768
    coreset_size: 7200
    stride: 1
    bank_stride: 1
    pool_size: 1
    max_bank_size: 80000
    topk_frac: 0.001
    chunk_size: 4096
    autocast_dtype: float16
    standardize: false
    seed: 0
    eps: 1.0e-06
    coreset_projection: null
    projection_eps: 0.9
- name: tiler_t2
  class_name: cuvis_ai_steervit.node.tiling.ImageTiler
  hparams:
    tiles: 2
- name: steervit_t2
  class_name: cuvis_ai_steervit.node.steervit.SteerViTExtractor
  hparams:
    backend: tensorrt
    engine_dir: D:/walnuts/walnut_fo_stack/trt_engines/steervit
    checkpoint: steervit_dinov2_base.pth
    hf_repo: JonaRuthardt/SteerViT
    prompts:
    - the anomaly in the walnuts
    topk_frac: 0.001
    score_activation: sigmoid
    autocast_dtype: float16
- name: stitch_t2
  class_name: cuvis_ai_steervit.node.tiling.GridStitcher
  hparams:
    tiles: 2
- name: patchcore_t2
  class_name: cuvis_ai_patchcore.node.patchcore.PatchCoreDetector
  hparams:
    input_channels: 768
    coreset_size: 7200
    stride: 1
    bank_stride: 1
    pool_size: 1
    max_bank_size: 80000
    topk_frac: 0.001
    chunk_size: 4096
    autocast_dtype: float16
    standardize: false
    seed: 0
    eps: 1.0e-06
    coreset_projection: null
    projection_eps: 0.9
- name: norm_t1
  class_name: cuvis_ai_patchcore.node.calibration.ScoreRangeNormalizer
  hparams:
    n_channels: 1
    low: 1.0
    high: 99.0
    floor: true
    fit_subsample: 4
    max_fit_values: 4000000
    seed: 0
    eps: 1.0e-09
- name: norm_t2
  class_name: cuvis_ai_patchcore.node.calibration.ScoreRangeNormalizer
  hparams:
    n_channels: 1
    low: 1.0
    high: 99.0
    floor: true
    fit_subsample: 4
    max_fit_values: 4000000
    seed: 0
    eps: 1.0e-09
- name: fuse
  class_name: cuvis_ai_patchcore.node.fusion.ScoreMapFusion
  hparams:
    mode: mean
    weights: null
- name: gate
  class_name: cuvis_ai_patchcore.node.gate.FrameScoreGate
  hparams:
    threshold: 1.35
    topk_frac: 0.001
    mode: heatmap
    mask_threshold: 1.35
    log_scores: true
    smooth_k: 3
- name: effad
  class_name: cuvis_ai_efficientad.node.efficientad.EfficientAdDetector
  hparams:
    backend: tensorrt
    engine_dir: D:/walnuts/walnut_fo_stack/trt_engines/efficientad
    image_size:
    - 512
    - 512
    teacher_out_channels: 384
    model_size: small
    padding: false
    pad_maps: true
    topk_frac: 0.001
    autocast_dtype: float16
- name: norm_effad
  class_name: cuvis_ai_patchcore.node.calibration.ScoreRangeNormalizer
  hparams:
    n_channels: 1
    low: 1.0
    high: 99.0
    floor: true
    fit_subsample: 4
    max_fit_values: 4000000
    seed: 0
    eps: 1.0e-09
- name: gate_effad
  class_name: cuvis_ai_patchcore.node.gate.FrameScoreGate
  hparams:
    threshold: 1.9587
    topk_frac: 0.001
    mode: heatmap
    mask_threshold: 2.7504
    log_scores: true
    smooth_k: 3
- name: display
  class_name: cuvis_ai_patchcore.node.fusion.ScoreMapFusion
  hparams:
    mode: first
    weights: null
- name: display_mask
  class_name: cuvis_ai_patchcore.node.fusion.DecisionFusion
  hparams:
    mode: first
connections:
- source: cu3s_data.outputs.cube
  target: cir_870_640_550.inputs.cube
- source: cu3s_data.outputs.wavelengths
  target: cir_870_640_550.inputs.wavelengths
- source: cu3s_data.outputs.cube
  target: patchcore_t1.inputs.reference
- source: cu3s_data.outputs.cube
  target: patchcore_t2.inputs.reference
- source: cir_870_640_550.outputs.rgb_image
  target: stretch.inputs.data
- source: stretch.outputs.normalized
  target: steervit_t1.inputs.rgb_image
- source: stretch.outputs.normalized
  target: tiler_t2.inputs.image
- source: stretch.outputs.normalized
  target: effad.inputs.rgb_image
- source: steervit_t1.outputs.features
  target: patchcore_t1.inputs.cube
- source: patchcore_t1.outputs.scores
  target: norm_t1.inputs.scores
- source: tiler_t2.outputs.tiles
  target: steervit_t2.inputs.rgb_image
- source: steervit_t2.outputs.features
  target: stitch_t2.inputs.tiles
- source: stitch_t2.outputs.grid
  target: patchcore_t2.inputs.cube
- source: patchcore_t2.outputs.scores
  target: norm_t2.inputs.scores
- source: norm_t1.outputs.normalized
  target: fuse.inputs.scores
- source: norm_t2.outputs.normalized
  target: fuse.inputs.scores
- source: fuse.outputs.scores
  target: gate.inputs.scores
- source: gate.outputs.scores
  target: display.inputs.scores
- source: effad.outputs.scores
  target: norm_effad.inputs.scores
- source: norm_effad.outputs.normalized
  target: gate_effad.inputs.scores
- source: gate_effad.outputs.scores
  target: display.inputs.scores
- source: gate.outputs.decisions
  target: display_mask.inputs.decisions
- source: gate_effad.outputs.decisions
  target: display_mask.inputs.decisions
