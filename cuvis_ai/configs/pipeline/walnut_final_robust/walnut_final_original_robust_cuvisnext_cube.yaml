metadata:
  name: walnut_final_original_robust_cuvisnext_cube
  description: 'ROBUST FO MASK: after the gate, blobs below 250 px go (FOSpeckFilter), a blob stays only if it holds >= 16 px that are not the empty belt (FOObjects: spectral angle to the frame median > 6 deg; FOObjectGate), and a pixel shows only if the frame before showed FO within 40 px (FOFlickerFilter). gate (alarm, heatmap, log) is unchanged: calibrate like the source. Copy of walnut_final_original_cuvisnext_cube: Variant of walnut_combo_gated_fp16trt_trt16_cuvisnext_cube. Composite view: Composite.mask (label map, 85 = shell, 255 = FO, FO on top) and Composite.scores (level map, shells 0.5, FO 1.0). The single outputs stay selectable: gate.scores (FO heatmap), FOMask.decisions (FO mask), ShellMask.decisions (shell mask), ShellHeatmap.scores (shell heatmap). Otherwise identical to the base: weights (.pt hardlink), thresholds (calibrate_live.py writes both), TensorRT engines.'
  created: ''
  tags:
  - anomaly
  - combined
  - hyperspectral
  - multiscale
  - patchcore
  - segmentation
  - split_v3
  - steervit
  - walnut
  - walnut_combo
  author: raj@cubert-gmbh.de
  cuvis_ai_version: 0.12.0
plugins:
- cuvis_ai_builtin
- patchcore
- steervit
- rfdetr_seg
nodes:
- name: cu3s_data
  class_name: cuvis_ai.node.data.CU3SDataNode
  hparams: {}
- name: cir_870_640_550
  class_name: cuvis_ai.node.channel_selector.FixedWavelengthSelector
  hparams:
    target_wavelengths:
    - 870.0
    - 640.0
    - 550.0
    normalize_output: false
- name: stretch
  class_name: cuvis_ai_steervit.node.stretch.JointPercentileStretch
  hparams:
    low: 2.0
    high: 98.0
    per_channel: false
    quantize_levels: 255
    eps: 1.0e-06
- name: steervit_t1
  class_name: cuvis_ai_steervit.node.steervit.SteerViTExtractor
  hparams:
    backend: tensorrt
    engine_dir: D:/walnuts/walnut_fo_stack/trt_engines/steervit
    checkpoint: steervit_dinov2_base.pth
    hf_repo: JonaRuthardt/SteerViT
    prompts:
    - the anomaly in the walnuts
    topk_frac: 0.001
    score_activation: sigmoid
    autocast_dtype: float16
- name: patchcore_t1
  class_name: cuvis_ai_patchcore.node.patchcore.PatchCoreDetector
  hparams:
    input_channels: 768
    coreset_size: 7200
    stride: 1
    bank_stride: 1
    pool_size: 1
    max_bank_size: 80000
    topk_frac: 0.001
    chunk_size: 4096
    autocast_dtype: float16
    standardize: false
    seed: 0
    eps: 1.0e-06
    coreset_projection: null
    projection_eps: 0.9
- name: tiler_t2
  class_name: cuvis_ai_steervit.node.tiling.ImageTiler
  hparams:
    tiles: 2
- name: steervit_t2
  class_name: cuvis_ai_steervit.node.steervit.SteerViTExtractor
  hparams:
    backend: tensorrt
    engine_dir: D:/walnuts/walnut_fo_stack/trt_engines/steervit
    checkpoint: steervit_dinov2_base.pth
    hf_repo: JonaRuthardt/SteerViT
    prompts:
    - the anomaly in the walnuts
    topk_frac: 0.001
    score_activation: sigmoid
    autocast_dtype: float16
- name: stitch_t2
  class_name: cuvis_ai_steervit.node.tiling.GridStitcher
  hparams:
    tiles: 2
- name: patchcore_t2
  class_name: cuvis_ai_patchcore.node.patchcore.PatchCoreDetector
  hparams:
    input_channels: 768
    coreset_size: 7200
    stride: 1
    bank_stride: 1
    pool_size: 1
    max_bank_size: 80000
    topk_frac: 0.001
    chunk_size: 4096
    autocast_dtype: float16
    standardize: false
    seed: 0
    eps: 1.0e-06
    coreset_projection: null
    projection_eps: 0.9
- name: norm_t1
  class_name: cuvis_ai_patchcore.node.calibration.ScoreRangeNormalizer
  hparams:
    n_channels: 1
    low: 1.0
    high: 99.0
    floor: true
    fit_subsample: 4
    max_fit_values: 4000000
    seed: 0
    eps: 1.0e-09
- name: norm_t2
  class_name: cuvis_ai_patchcore.node.calibration.ScoreRangeNormalizer
  hparams:
    n_channels: 1
    low: 1.0
    high: 99.0
    floor: true
    fit_subsample: 4
    max_fit_values: 4000000
    seed: 0
    eps: 1.0e-09
- name: fuse
  class_name: cuvis_ai_patchcore.node.fusion.ScoreMapFusion
  hparams:
    mode: mean
    weights: null
- name: gate
  class_name: cuvis_ai_patchcore.node.gate.FrameScoreGate
  hparams:
    threshold: 1.35
    mask_threshold: 1.35
    topk_frac: 0.001
    mode: heatmap
    log_scores: true
- name: SelRGB
  class_name: cuvis_ai.node.channel_selector.FixedWavelengthSelector
  hparams:
    target_wavelengths:
    - 640.0
    - 550.0
    - 470.0
    normalize_output: true
    norm_mode: per_frame
    apply_gamma: false
    freeze_running_bounds_after_frames: 20
    running_warmup_frames: 10
- name: SelCIR
  class_name: cuvis_ai.node.channel_selector.FixedWavelengthSelector
  hparams:
    target_wavelengths:
    - 850.0
    - 660.0
    - 550.0
    normalize_output: true
    norm_mode: per_frame
    apply_gamma: false
    freeze_running_bounds_after_frames: 20
    running_warmup_frames: 10
- name: SegRGB
  class_name: cuvis_ai_rfdetr.node.rfdetr_segmenter.RFDETRSegmenter
  hparams:
    checkpoint_path: D:/walnuts/walnut_fo_stack/cuvis-ai/cuvis_ai/configs/pipeline/walnut_seg/weights/rgb_v2_ema.pth
    variant: large
    threshold: 0.05
    resolution: 504
    tiling: whole
    tile_rows: 405
    row_starts:
    - 0
    - 291
    - 582
    nms_iou: 0.5
    jpeg_roundtrip: false
    jpeg_quality: 95
    class_filter: 0
    score_reduction: max_conf
    top_frac: 0.001
    checkpoint_loader: constructor
    backend: tensorrt
    precision: fp16
    jit_trace: false
    gpu_input: true
    fast_paste: true
- name: ShellFuse
  class_name: cuvis_ai_rfdetr.node.score_fusion.ScoreFusion
  hparams:
    mode: mean
    weight: 0.5
- name: SegCIR
  class_name: cuvis_ai_rfdetr.node.rfdetr_segmenter.RFDETRSegmenter
  hparams:
    checkpoint_path: D:/walnuts/walnut_fo_stack/cuvis-ai/cuvis_ai/configs/pipeline/walnut_seg/weights/cir_v2_ema.pth
    variant: large
    threshold: 0.05
    resolution: 504
    tiling: whole
    tile_rows: 405
    row_starts:
    - 0
    - 291
    - 582
    nms_iou: 0.5
    jpeg_roundtrip: false
    jpeg_quality: 95
    class_filter: 0
    score_reduction: max_conf
    top_frac: 0.001
    checkpoint_loader: constructor
    backend: tensorrt
    precision: fp16
    jit_trace: false
    gpu_input: true
    fast_paste: true
- name: ShellDecider
  class_name: cuvis_ai.node.deciders.binary_decider.BinaryDecider
  hparams:
    threshold: 0.6224593312018546
- name: ShellHeatmap
  class_name: cuvis_ai_rfdetr.node.score_fusion.ScoreFusion
  hparams:
    mode: max
    weight: 0.5
- name: ShellMask
  class_name: cuvis_ai_patchcore.node.fusion.DecisionFusion
  hparams:
    mode: any
- name: FOMask
  class_name: cuvis_ai_patchcore.node.fusion.DecisionFusion
  hparams:
    mode: any
- name: Composite
  class_name: cuvis_ai_patchcore.node.fusion.MaskComposite
  hparams:
    labels: [85, 255]
    levels: [0.5, 1.0]
- name: FOSpeckFilter
  class_name: cuvis_ai_patchcore.node.morphology.MaskMinArea
  hparams:
    min_area: 250
- name: FOObjects
  class_name: cuvis_ai_patchcore.node.objectness.SpectralObjectMask
  hparams:
    min_angle_deg: 6.0
    stride: 4
- name: FOObjectGate
  class_name: cuvis_ai_patchcore.node.morphology.MaskBlobGate
  hparams:
    min_px: 16
- name: FOFlickerFilter
  class_name: cuvis_ai_patchcore.node.temporal.MaskPersistence
  hparams:
    radius_px: 40
