metadata:
  name: Spectral_Match
  description: Highlights the pixels whose spectral angle to the nearest of N signature spectra
    lies below (keep below, "similar") or above (keep above, "different") a threshold, and drops
    blobs under min_area pixels. The host sends the cube with its wavelengths and the signature
    as spectral_signature [N, 1, 1, C] float32 (one mean spectrum per label, same bands and
    processing mode as the cube); an optional threshold [1] float32 in radians replaces the
    match node's threshold for that frame, so a slider needs no reload. Nothing is fitted, so a
    new signature needs no reload either. Outputs - mask.decisions [B, H, W, 1],
    spectral_angle.best_scores (radians) and spectral_angle.identity_mask (1-based label).
  tags:
  - segmentation
  - spectral-angle
  - spectral-match
  author: cuvis.ai
plugins:
- cuvis_ai_builtin
nodes:
- name: cu3s_data
  class_name: cuvis_ai.node.data.CU3SDataNode
  hparams: {}
- name: spectral_angle
  class_name: cuvis_ai.node.spectral_angle_mapper.SpectralAngleMapper
  hparams:
    num_channels: null
    eps: 1.0e-12
- name: match
  class_name: cuvis_ai.node.deciders.binary_decider.ScoreThreshold
  hparams:
    threshold: 0.1
    keep: below
- name: mask
  class_name: cuvis_ai.node.mask_ops.MaskMinArea
  hparams:
    min_area: 0
    cell: 4
connections:
- source: cu3s_data.outputs.cube
  target: spectral_angle.inputs.cube
- source: spectral_angle.outputs.best_scores
  target: match.inputs.scores
- source: match.outputs.decisions
  target: mask.inputs.decisions
