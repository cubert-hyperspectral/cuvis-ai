metadata:
  name: SAM3_Text_Propagation_Video
  description: SAM3 text-prompt propagation with RGB video frame source
  tags:
  - tracking
  - sam3
  - text-prompt
  - video
  author: cuvis.ai
plugins:
- cuvis_ai_builtin
- sam3
nodes:
- name: video_frame
  class_name: cuvis_ai.node.video.VideoFrameNode
  hparams: {}
- name: sam3_tracker
  class_name: cuvis_ai_sam3.node.SAM3TextPropagation
  hparams:
    score_threshold_detection: 0.5
    new_det_thresh: 0.7
    det_nms_thresh: 0.1
    overlap_suppress_thresh: 0.7
    max_tracker_states: 5
- name: tracking_coco_json
  class_name: cuvis_ai.node.json_file.CocoTrackMaskWriter
  hparams:
    output_json_path: outputs/tracking_results.json
    default_category_name: object
connections:
- source: video_frame.outputs.rgb_image
  target: sam3_tracker.inputs.rgb_image
- source: video_frame.outputs.frame_id
  target: sam3_tracker.inputs.frame_id
- source: video_frame.outputs.frame_id
  target: tracking_coco_json.inputs.frame_id
- source: sam3_tracker.outputs.mask
  target: tracking_coco_json.inputs.mask
- source: sam3_tracker.outputs.object_ids
  target: tracking_coco_json.inputs.object_ids
- source: sam3_tracker.outputs.detection_scores
  target: tracking_coco_json.inputs.detection_scores
- source: sam3_tracker.outputs.category_ids
  target: tracking_coco_json.inputs.category_ids
- source: sam3_tracker.outputs.category_semantics
  target: tracking_coco_json.inputs.category_semantics
