metadata:
  name: RTSAM2_Mask_Propagation
  description: RTSAM2 runtime-mask propagation with CU3S source-domain frame mapping
  tags:
  - tracking
  - rtsam2
  - mask-prompt
  - rgb
  - video
  - propagation
  author: cuvis.ai
plugins:
- cuvis_ai_builtin
- rtsam2
nodes:
- name: cu3s_data
  class_name: cuvis_ai.node.data.CU3SDataNode
  hparams: {}
- name: true_rgb
  class_name: cuvis_ai.node.channel_selector.CIETristimulusRGBSelector
  hparams: {}
- name: rtsam2_tracker
  class_name: cuvis_ai_rtsam2.node.rtsam2_streaming_propagation.RTSAM2MaskPropagation
  hparams:
    model_type: efficienttam
    # model_dir: checkpoints  # absolute path, or relative to the rtsam2 repo root
- name: tracking_coco_json
  class_name: cuvis_ai.node.json_file.CocoTrackMaskWriter
  hparams:
    output_json_path: outputs/tracking_results.json
    default_category_name: person
connections:
- source: cu3s_data.outputs.cube
  target: true_rgb.inputs.cube
- source: cu3s_data.outputs.wavelengths
  target: true_rgb.inputs.wavelengths
- source: true_rgb.outputs.rgb_image
  target: rtsam2_tracker.inputs.rgb_image
- source: cu3s_data.outputs.mesu_index
  target: rtsam2_tracker.inputs.frame_id
- source: cu3s_data.outputs.mesu_index
  target: tracking_coco_json.inputs.frame_id
- source: rtsam2_tracker.outputs.mask
  target: tracking_coco_json.inputs.mask
- source: rtsam2_tracker.outputs.object_ids
  target: tracking_coco_json.inputs.object_ids
- source: rtsam2_tracker.outputs.detection_scores
  target: tracking_coco_json.inputs.detection_scores
