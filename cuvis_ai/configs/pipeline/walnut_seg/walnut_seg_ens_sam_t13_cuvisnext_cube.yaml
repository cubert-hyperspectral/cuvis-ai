  description: 'Walnut shell segmentation (ens_sam_t13). Outputs (both selectable
    in cuvis.next): ShellHeatmap.scores = shell probability heatmap (exact copy of
    Gate.scores: ScoreFusion max of the map with itself, so the port is terminal and
    named ''scores''); ShellMask.decisions = boolean shell mask (scores >= 0.5; BinaryDecider
    threshold = sigmoid(0.5)).'
