# EfficientAD plugin manifest
#
# EfficientAD for Cuvis.AI: student-teacher + autoencoder anomaly maps of an RGB frame (anomalib 2.1.0 model).
#
# To use it, declare `plugins: [efficientad]` in the pipeline yaml and point
# the loader at the catalog directory that holds this manifest:
#   uv run restore-pipeline --pipeline-path <pipeline>.yaml --plugins-dir cuvis_ai/configs/plugins

name: efficientad
# Local development override (optional):
# path: "../../../cuvis-ai-efficientad"
repo: "https://github.com/cubert-hyperspectral/cuvis-ai-efficientad.git"
tag: "v0.3.0"
package_name: "cuvis-ai-efficientad"
capabilities:
- class_name: cuvis_ai_efficientad.node.efficientad.EfficientAdDetector
  category: model
  tags: [anomaly, image, torch]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#4E7BD4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <circle cx=\"14\" cy=\"20\" r=\"3\"/>\n  <circle cx=\"14\" cy=\"32\" r=\"3\"/>\n  <circle cx=\"14\" cy=\"44\" r=\"3\"/>\n  <circle cx=\"32\" cy=\"16\" r=\"3\"/>\n  <circle cx=\"32\" cy=\"32\" r=\"3\"/>\n  <circle cx=\"32\" cy=\"48\" r=\"3\"/>\n  <circle cx=\"50\" cy=\"26\" r=\"3\"/>\n  <circle cx=\"50\" cy=\"38\" r=\"3\"/>\n  <path d=\"M17 20l12-4M17 32l12-16M17 44l12-28\"/>\n  <path d=\"M17 20l12 12M17 32l12 0M17 44l12-12\"/>\n  <path d=\"M17 20l12 28M17 32l12 16M17 44l12 4\"/>\n  <path d=\"M35 16l12 10M35 32l12-6M35 48l12-22\"/>\n  <path d=\"M35 16l12 22M35 32l12 6M35 48l12-10\"/>\n</svg>\n"
  input_specs:
    rgb_image:
      dtype: float32
      shape: [-1, -1, -1, 3]
      optional: false
      description: RGB frame [B, H, W, 3] in [0, 1], e.g. a stretched false-RGB projection; resized to `image_size` internally (the model normalises with ImageNet statistics).
  output_specs:
    scores:
      dtype: float32
      shape: [-1, -1, -1, 1]
      optional: false
      description: "Anomaly map [B, H, W, 1]: anomalib's anomaly_map (mean of the quantile-normalised student-teacher and student-autoencoder maps), resized to the input."
    anomaly_score:
      dtype: float32
      shape: [-1]
      optional: false
      description: 'Image-level score [B]: mean of the top topk_frac pixels of `scores`.'
  doc_summary: EfficientAD student-teacher + autoencoder anomaly map and image score of an RGB frame.
