# cuvis-ai-unet — bare plugin manifest (one yaml = one plugin).
#
# Local-path source for edit-and-reload development: `path` is resolved
# relative to THIS file. Swap to the git-tag form (repo + tag) for a frozen,
# reproducible install once a release is cut.
#
# `capabilities` lists the node classes a pipeline may instantiate; the
# manifest is validated by NodeRegistry.register_plugin (see
# tests/test_plugin_manifest_loading.py).
name: unet
package_name: cuvis-ai-unet
repo: "https://github.com/cubert-hyperspectral/cuvis-ai-unet.git"
tag: "v0.2.0"
capabilities:
- class_name: cuvis_ai_unet.node.dynunet.DynUNet
  category: model
  tags: [differentiable, hyperspectral, inference, learnable, segmentation, torch]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#4E7BD4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <circle cx=\"14\" cy=\"20\" r=\"3\"/>\n  <circle cx=\"14\" cy=\"32\" r=\"3\"/>\n  <circle cx=\"14\" cy=\"44\" r=\"3\"/>\n  <circle cx=\"32\" cy=\"16\" r=\"3\"/>\n  <circle cx=\"32\" cy=\"32\" r=\"3\"/>\n  <circle cx=\"32\" cy=\"48\" r=\"3\"/>\n  <circle cx=\"50\" cy=\"26\" r=\"3\"/>\n  <circle cx=\"50\" cy=\"38\" r=\"3\"/>\n  <path d=\"M17 20l12-4M17 32l12-16M17 44l12-28\"/>\n  <path d=\"M17 20l12 12M17 32l12 0M17 44l12-12\"/>\n  <path d=\"M17 20l12 28M17 32l12 16M17 44l12 4\"/>\n  <path d=\"M35 16l12 10M35 32l12-6M35 48l12-22\"/>\n  <path d=\"M35 16l12 22M35 32l12 6M35 48l12-10\"/>\n</svg>\n"
  input_specs:
    data:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Hyperspectral cube [B, H, W, C_bands]
  output_specs:
    logits:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Per-pixel class logits [B, H, W, num_classes]
  doc_summary: Configurable U-Net for hyperspectral segmentation (2D / factorised 2.5D / 3D).
- class_name: cuvis_ai_unet.node.losses.DiceLoss
  category: loss
  tags: [differentiable, segmentation, torch, training]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#9A5DD4\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M10 14v40h44\"/>\n  <path d=\"M14 18c8 0 12 8 18 18s12 14 22 14\"/>\n  <path d=\"M48 44l6 6-6 6\" transform=\"translate(0 -6)\"/>\n</svg>\n"
  input_specs:
    logits:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Per-pixel class logits [B, H, W, num_classes]
    targets:
      dtype: int32
      shape: [-1, -1, -1]
      optional: false
      description: Integer class-index mask [B, H, W] (cast to int64 internally; trailing [.,1] ok)
  output_specs:
    loss:
      dtype: float32
      shape: []
      optional: false
      description: Scalar loss value
  doc_summary: Soft Dice loss over the DynUNet logits.
- class_name: cuvis_ai_unet.node.losses.CrossEntropyLoss
  category: loss
  tags: [differentiable, segmentation, torch, training]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#9A5DD4\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M10 14v40h44\"/>\n  <path d=\"M14 18c8 0 12 8 18 18s12 14 22 14\"/>\n  <path d=\"M48 44l6 6-6 6\" transform=\"translate(0 -6)\"/>\n</svg>\n"
  input_specs:
    logits:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Per-pixel class logits [B, H, W, num_classes]
    targets:
      dtype: int32
      shape: [-1, -1, -1]
      optional: false
      description: Integer class-index mask [B, H, W] (cast to int64 internally; trailing [.,1] ok)
  output_specs:
    loss:
      dtype: float32
      shape: []
      optional: false
      description: Scalar loss value
  doc_summary: Pixel-wise cross-entropy over the DynUNet logits (multiclass, ``K >= 2``).
- class_name: cuvis_ai_unet.node.losses.OHEMCrossEntropyLoss
  category: loss
  tags: [differentiable, segmentation, torch, training]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#9A5DD4\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M10 14v40h44\"/>\n  <path d=\"M14 18c8 0 12 8 18 18s12 14 22 14\"/>\n  <path d=\"M48 44l6 6-6 6\" transform=\"translate(0 -6)\"/>\n</svg>\n"
  input_specs:
    logits:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Per-pixel class logits [B, H, W, num_classes]
    targets:
      dtype: int32
      shape: [-1, -1, -1]
      optional: false
      description: Integer class-index mask [B, H, W] (cast to int64 internally; trailing [.,1] ok)
  output_specs:
    loss:
      dtype: float32
      shape: []
      optional: false
      description: Scalar loss value
  doc_summary: Cross-entropy with online hard-example mining (OHEM) on the background.
- class_name: cuvis_ai_unet.node.seg_metrics.SegMetrics
  category: metric
  tags: [evaluation, segmentation]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#C9615A\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M10 14v40h44\"/>\n  <rect x=\"16\" y=\"38\" width=\"8\" height=\"12\"/>\n  <rect x=\"28\" y=\"28\" width=\"8\" height=\"22\"/>\n  <rect x=\"40\" y=\"18\" width=\"8\" height=\"32\"/>\n</svg>\n"
  input_specs:
    logits:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Per-pixel class logits [B, H, W, num_classes]
    targets:
      dtype: int32
      shape: [-1, -1, -1]
      optional: false
      description: Integer per-pixel class targets [B, H, W]
  output_specs:
    metrics:
      dtype: ''
      shape: []
      optional: false
      description: list[Metric]
  doc_summary: Foreground IoU / Dice / pixel-accuracy over per-pixel class logits.
- class_name: cuvis_ai_unet.node.scoring.SegmentationAnomalyScore
  category: transform
  tags: [evaluation, segmentation, torch]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#6FAE5C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M52 26a20 20 0 0 0-36 0\"/>\n  <path d=\"M52 16v10h-10\"/>\n  <path d=\"M12 38a20 20 0 0 0 36 0\"/>\n  <path d=\"M12 48v-10h10\"/>\n</svg>\n"
  input_specs:
    logits:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Per-pixel class logits [B, H, W, num_classes]
    targets:
      dtype: int32
      shape: [-1, -1, -1]
      optional: true
      description: Optional integer class mask [B, H, W]; when connected, emits targets_bool for a paired AUROC node
  output_specs:
    scores:
      dtype: float32
      shape: [-1, -1, -1, 1]
      optional: false
      description: Foreground-probability map [B, H, W, 1]
    anomaly_score:
      dtype: float32
      shape: [-1]
      optional: false
      description: 'Per-image score: mean of the top-`top_frac` score pixels [B]'
    targets_bool:
      dtype: bool
      shape: [-1, -1, -1, 1]
      optional: true
      description: Boolean foreground mask [B, H, W, 1] (only when targets connected)
  doc_summary: Adapt segmentation logits to anomaly-detection score maps + a per-image score.

