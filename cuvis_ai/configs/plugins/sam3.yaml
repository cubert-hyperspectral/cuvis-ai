  input_specs:
    rgb_frame:
      dtype: float32
      shape: [1, -1, -1, 3]
      optional: false
      description: ''
    frame_id:
      dtype: int64
      shape: [1]
      optional: true
      description: Source frame index [1]. If omitted, local stream index is used.
    bboxes:
      dtype: ''
      shape: []
      optional: true
      description: Optional per-frame list of bbox prompt dicts with keys element_id, object_id, x_min, y_min, x_max, y_max.
  output_specs:
    mask:
      dtype: int32
      shape: [1, -1, -1]
      optional: false
      description: ''
    object_ids:
      dtype: int64
      shape: [1, -1]
      optional: false
