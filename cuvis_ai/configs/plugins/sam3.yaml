# SAM3 Plugin Manifest
#
# To use SAM3, declare `plugins: [sam3]` in the pipeline yaml and point
# the loader at the catalog directory that holds this manifest:
#   uv run restore-pipeline --pipeline-path <pipeline>.yaml --plugins-dir cuvis_ai/configs/plugins

name: sam3
# SAM3-based video object tracking plugin.
#
# Temporary local-checkout source. SAM3PointExpansion is not yet in a tagged
# sam3 release, so the loader points at the local working tree. Restore the
# repo/tag pin below once sam3 ships a release that includes the node.
path: "D:/code-repos/cuvis-ai-sam3/cuvis-ai-sam3"
# repo: "https://github.com/cubert-hyperspectral/cuvis-ai-sam3.git"
# tag: "v0.1.7"  # v0.1.7 relaxes setuptools to <83 so sam3 co-installs with cuvis-ai (>=81)
# package_name: "cuvis-ai-sam3"
capabilities:
- class_name: cuvis_ai_sam3.node.SAM3TrackerInference
  category: model
  tags: [batched, inference, learnable, mask, rgb, segmentation, stateful, torch, tracking, video]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#4E7BD4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\r\n  <circle cx=\"14\" cy=\"20\" r=\"3\"/>\r\n  <circle cx=\"14\" cy=\"32\" r=\"3\"/>\r\n  <circle cx=\"14\" cy=\"44\" r=\"3\"/>\r\n  <circle cx=\"32\" cy=\"16\" r=\"3\"/>\r\n  <circle cx=\"32\" cy=\"32\" r=\"3\"/>\r\n  <circle cx=\"32\" cy=\"48\" r=\"3\"/>\r\n  <circle cx=\"50\" cy=\"26\" r=\"3\"/>\r\n  <circle cx=\"50\" cy=\"38\" r=\"3\"/>\r\n  <path d=\"M17 20l12-4M17 32l12-16M17 44l12-28\"/>\r\n  <path d=\"M17 20l12 12M17 32l12 0M17 44l12-12\"/>\r\n  <path d=\"M17 20l12 28M17 32l12 16M17 44l12 4\"/>\r\n  <path d=\"M35 16l12 10M35 32l12-6M35 48l12-22\"/>\r\n  <path d=\"M35 16l12 22M35 32l12 6M35 48l12-10\"/>\r\n</svg>\r\n"
  input_specs:
    rgb_frame:
      dtype: float32
      shape: [1, -1, -1, 3]
      optional: false
      description: ''
    frame_id:
      dtype: int64
      shape: [1]
      optional: true
      description: Source frame index [1]. If omitted, local stream index is used.
  output_specs:
    mask:
      dtype: int32
      shape: [1, -1, -1]
      optional: false
      description: ''
    object_ids:
      dtype: int64
      shape: [1, -1]
      optional: false
      description: ''
    detection_scores:
      dtype: float32
      shape: [1, -1]
      optional: false
      description: ''
  doc_summary: Abstract base for streaming SAM3 propagation nodes.
- class_name: cuvis_ai_sam3.node.SAM3TextPropagation
  category: model
  tags: [batched, inference, learnable, mask, rgb, segmentation, stateful, text, torch, tracking, video]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#4E7BD4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\r\n  <circle cx=\"14\" cy=\"20\" r=\"3\"/>\r\n  <circle cx=\"14\" cy=\"32\" r=\"3\"/>\r\n  <circle cx=\"14\" cy=\"44\" r=\"3\"/>\r\n  <circle cx=\"32\" cy=\"16\" r=\"3\"/>\r\n  <circle cx=\"32\" cy=\"32\" r=\"3\"/>\r\n  <circle cx=\"32\" cy=\"48\" r=\"3\"/>\r\n  <circle cx=\"50\" cy=\"26\" r=\"3\"/>\r\n  <circle cx=\"50\" cy=\"38\" r=\"3\"/>\r\n  <path d=\"M17 20l12-4M17 32l12-16M17 44l12-28\"/>\r\n  <path d=\"M17 20l12 12M17 32l12 0M17 44l12-12\"/>\r\n  <path d=\"M17 20l12 28M17 32l12 16M17 44l12 4\"/>\r\n  <path d=\"M35 16l12 10M35 32l12-6M35 48l12-22\"/>\r\n  <path d=\"M35 16l12 22M35 32l12 6M35 48l12-10\"/>\r\n</svg>\r\n"
  input_specs:
    rgb_frame:
      dtype: float32
      shape: [1, -1, -1, 3]
      optional: false
      description: ''
    frame_id:
      dtype: int64
      shape: [1]
      optional: true
      description: Source frame index [1]. If omitted, local stream index is used.
    text_prompt:
      dtype: ''
      shape: []
      optional: true
      description: Optional text prompt applied on the current frame.
  output_specs:
    mask:
      dtype: int32
      shape: [1, -1, -1]
      optional: false
      description: ''
    object_ids:
      dtype: int64
      shape: [1, -1]
      optional: false
      description: ''
    detection_scores:
      dtype: float32
      shape: [1, -1]
      optional: false
      description: ''
    category_ids:
      dtype: int64
      shape: [1, -1]
      optional: false
      description: Category IDs [1,N], aligned with object_ids.
    category_semantics:
      dtype: uint8
      shape: [-1]
      optional: false
      description: UTF-8 JSON bytes of the cumulative category-id-to-text mapping, for example {"1":"person","2":"car"}.
  doc_summary: SAM3 streaming propagation with a text/concept prompt.
