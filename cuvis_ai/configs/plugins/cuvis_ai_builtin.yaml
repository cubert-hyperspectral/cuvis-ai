- class_name: cuvis_ai.node.anomaly_visualization.AnomalyMask
  category: visualizer
  tags: [anomaly, mask]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#9A5DD4\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <rect x=\"8\" y=\"10\" width=\"48\" height=\"44\" rx=\"2\"/>\n  <path d=\"M14 44l10-12 8 6 12-16\"/>\n  <circle cx=\"14\" cy=\"44\" r=\"1.5\" fill=\"#9A5DD4\" stroke=\"none\"/>\n  <circle cx=\"24\" cy=\"32\" r=\"1.5\" fill=\"#9A5DD4\" stroke=\"none\"/>\n  <circle cx=\"32\" cy=\"38\" r=\"1.5\" fill=\"#9A5DD4\" stroke=\"none\"/>\n  <circle cx=\"44\" cy=\"22\" r=\"1.5\" fill=\"#9A5DD4\" stroke=\"none\"/>\n</svg>\n"
  input_specs:
    decisions:
      dtype: bool
      shape: [-1, -1, -1, 1]
      optional: false
      description: Binary anomaly decisions [B, H, W, 1]
    mask:
      dtype: bool
      shape: [-1, -1, -1, 1]
      optional: true
      description: Ground truth anomaly mask [B, H, W, 1] (optional)
    cube:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Original cube [B, H, W, C] for visualization
    scores:
      dtype: float32
      shape: [-1, -1, -1, 1]
      optional: true
      description: Optional anomaly logits/scores [B, H, W, 1]
  output_specs:
    artifacts:
      dtype: ''
      shape: []
      optional: false
      description: List of Artifact objects with heatmap visualizations
  doc_summary: Visualize anomaly detection with GT and predicted masks.
