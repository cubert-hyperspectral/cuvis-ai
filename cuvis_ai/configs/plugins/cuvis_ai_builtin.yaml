# Built-in cuvis-ai nodes from this repository.
# Useful when the gRPC server runs in a different venv and cannot import `cuvis_ai.*` directly.
name: cuvis_ai_builtin
path: "../../.."
capabilities:
- class_name: cuvis_ai.node.anomaly.deep_svdd.DeepSVDDCenterTracker
  category: transform
  tags: [anomaly, stateful, torch, training]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#6FAE5C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M52 26a20 20 0 0 0-36 0\"/>\n  <path d=\"M52 16v10h-10\"/>\n  <path d=\"M12 38a20 20 0 0 0 36 0\"/>\n  <path d=\"M12 48v-10h10\"/>\n</svg>\n"
  input_specs:
    embeddings:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Deep SVDD embeddings [B, H, W, D]
  output_specs:
    center:
      dtype: float32
      shape: [-1]
      optional: false
      description: Tracked Deep SVDD center vector
    metrics:
      dtype: ''
      shape: []
      optional: true
      description: Optional scalar summaries of the center
  doc_summary: Track and expose Deep SVDD center statistics with optional logging.
- class_name: cuvis_ai.node.anomaly.deep_svdd.DeepSVDDProjection
  category: model
  tags: [anomaly, hyperspectral, inference, learnable, torch]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#4E7BD4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <circle cx=\"14\" cy=\"20\" r=\"3\"/>\n  <circle cx=\"14\" cy=\"32\" r=\"3\"/>\n  <circle cx=\"14\" cy=\"44\" r=\"3\"/>\n  <circle cx=\"32\" cy=\"16\" r=\"3\"/>\n  <circle cx=\"32\" cy=\"32\" r=\"3\"/>\n  <circle cx=\"32\" cy=\"48\" r=\"3\"/>\n  <circle cx=\"50\" cy=\"26\" r=\"3\"/>\n  <circle cx=\"50\" cy=\"38\" r=\"3\"/>\n  <path d=\"M17 20l12-4M17 32l12-16M17 44l12-28\"/>\n  <path d=\"M17 20l12 12M17 32l12 0M17 44l12-12\"/>\n  <path d=\"M17 20l12 28M17 32l12 16M17 44l12 4\"/>\n  <path d=\"M35 16l12 10M35 32l12-6M35 48l12-22\"/>\n  <path d=\"M35 16l12 22M35 32l12 6M35 48l12-10\"/>\n</svg>\n"
  input_specs:
    data:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Per-pixel feature tensor [B, H, W, C]
  output_specs:
    embeddings:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Deep SVDD embeddings [B, H, W, rep_dim]
  doc_summary: Projection head that maps per-pixel features to Deep SVDD embeddings.
- class_name: cuvis_ai.node.anomaly.deep_svdd.DeepSVDDScores
  category: model
  tags: [anomaly, inference, learnable, torch]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#4E7BD4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <circle cx=\"14\" cy=\"20\" r=\"3\"/>\n  <circle cx=\"14\" cy=\"32\" r=\"3\"/>\n  <circle cx=\"14\" cy=\"44\" r=\"3\"/>\n  <circle cx=\"32\" cy=\"16\" r=\"3\"/>\n  <circle cx=\"32\" cy=\"32\" r=\"3\"/>\n  <circle cx=\"32\" cy=\"48\" r=\"3\"/>\n  <circle cx=\"50\" cy=\"26\" r=\"3\"/>\n  <circle cx=\"50\" cy=\"38\" r=\"3\"/>\n  <path d=\"M17 20l12-4M17 32l12-16M17 44l12-28\"/>\n  <path d=\"M17 20l12 12M17 32l12 0M17 44l12-12\"/>\n  <path d=\"M17 20l12 28M17 32l12 16M17 44l12 4\"/>\n  <path d=\"M35 16l12 10M35 32l12-6M35 48l12-22\"/>\n  <path d=\"M35 16l12 22M35 32l12 6M35 48l12-10\"/>\n</svg>\n"
  input_specs:
    embeddings:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Deep SVDD embeddings [B, H, W, D]
    center:
      dtype: float32
      shape: [-1]
      optional: false
      description: Center vector from DeepSVDDCenterTracker
  output_specs:
    scores:
      dtype: float32
      shape: [-1, -1, -1, 1]
      optional: false
      description: Squared distance scores [B, H, W, 1]
  doc_summary: Convert Deep SVDD embeddings + center vector into anomaly scores.
- class_name: cuvis_ai.node.anomaly.deep_svdd.ZScoreNormalizerGlobal
  category: transform
  tags: [hyperspectral, normalization, numpy, preprocessing]
  icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#6FAE5C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M52 26a20 20 0 0 0-36 0\"/>\n  <path d=\"M52 16v10h-10\"/>\n  <path d=\"M12 38a20 20 0 0 0 36 0\"/>\n  <path d=\"M12 48v-10h10\"/>\n</svg>\n"
  input_specs:
    data:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Input hyperspectral cube [B, H, W, C]
  output_specs:
    normalized:
      dtype: float32
      shape: [-1, -1, -1, -1]
      optional: false
      description: Per-pixel z-score normalized cube [B, H, W, C]
  doc_summary: Port-based Deep SVDD z-score normalizer for BHWC cubes.
- class_name: cuvis_ai.node.anomaly.lad_detector.LADGlobal
  category: model
  tags: [anomaly, hyperspectral, learnable, numpy]
