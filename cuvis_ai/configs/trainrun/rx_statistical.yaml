# @package _global_


defaults:
- /data@data: lentils
- /training@training: default
- _self_


name: rx_statistical

# Pipeline reference, resolved relative to this trainrun's directory.
pipeline: ../pipeline/anomaly/rx/rx_statistical.yaml

training:
  seed: 42
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.0
    betas:
  max_epochs: 10
  accelerator: auto
  devices:
  default_root_dir:
  precision: 32-true
  accumulate_grad_batches: 1
  enable_progress_bar: true
  enable_checkpointing: false
  log_every_n_steps: 50
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  gradient_clip_val:
  deterministic: false
  benchmark: false
  callbacks:
output_dir: outputs\rx_statistical
unfreeze_nodes: []
freeze_nodes: []
metric_nodes:
- metrics_anomaly
loss_nodes: []
