# @package _global_

name: adaclip_supervised_full_spectrum

defaults:
  - /pipeline/anomaly/adaclip@pipeline: adaclip_supervised_full_spectrum
  - /data@data: lentils
  - _self_

data:
  # Override splits for this example
  splits:
    leakage_check: warn  # train/val intentionally share frame 2 (small-dataset reuse)
    train:
      - {kind: file_indices, source: data/Lentils/Lentils_000.cu3s, ids: [0, 2]}
    val:
      - {kind: file_indices, source: data/Lentils/Lentils_000.cu3s, ids: [2, 4]}
    test:
      - {kind: file_indices, source: data/Lentils/Lentils_000.cu3s, ids: [1, 3, 5]}
  batch_size: 1


output_dir: outputs\adaclip_supervised_full_spectrum

metric_nodes:
- detection_metrics

loss_nodes: []

