name: drcnn_adaclip
# Pipeline reference (extracted snapshot), resolved next to this trainrun.
pipeline: drcnn_adaclip_trainrun_pipeline.yaml
data:
  data_module: cu3s
  splits:
    leakage_check: warn  # val/test intentionally share frame 1 (small-dataset reuse)
    train:
      - {kind: file_indices, source: data/Lentils/Lentils_000.cu3s, ids: [0, 2, 3]}
    val:
      - {kind: file_indices, source: data/Lentils/Lentils_000.cu3s, ids: [1]}
    test:
      - {kind: file_indices, source: data/Lentils/Lentils_000.cu3s, ids: [1, 5]}
  batch_size: 2
  params:
    cu3s_file_path: data/Lentils/Lentils_000.cu3s
    annotation_json_path: data/Lentils/Lentils_000.json
    processing_mode: Reflectance
training:
  seed: 42
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.01
    momentum: 0.9
    betas:
    - 0.9
    - 0.999
  scheduler:
    name: reduce_on_plateau
    warmup_epochs: 0
    min_lr: 1.0e-06
    t_max: null
    step_size: null
    gamma: null
    monitor: metrics_anomaly/iou
    mode: max
    factor: 0.5
    patience: 5
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    eps: 1.0e-08
    verbose: false
  callbacks: null
  trainer:
    max_epochs: 20
    accelerator: auto
    devices: 1
    default_root_dir: ./outputs/drcnn_adaclip
    precision: 32-true
    accumulate_grad_batches: 1
    enable_progress_bar: true
    enable_checkpointing: true
    log_every_n_steps: 10
    val_check_interval: 1.0
    check_val_every_n_epoch: 1
    gradient_clip_val: 1.0
    deterministic: false
    benchmark: false
    callbacks:
      checkpoint:
        dirpath: outputs\drcnn_adaclip\checkpoints
        filename: '{epoch:02d}'
        monitor: metrics_anomaly/iou
        mode: max
        save_top_k: 3
        every_n_epochs: 1
        save_last: true
        auto_insert_metric_name: true
        verbose: true
        save_on_exception: false
        save_weights_only: false
        every_n_train_steps: null
        train_time_interval: null
        save_on_train_epoch_end: null
        enable_version_counter: true
      early_stopping: []
      learning_rate_monitor:
        logging_interval: epoch
        log_momentum: false
        log_weight_decay: false
  max_epochs: 20
  batch_size: 32
  num_workers: 4
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
loss_nodes:
- iou_loss
metric_nodes:
- metrics_anomaly
freeze_nodes: []
unfreeze_nodes:
- channel_mixer
output_dir: outputs\drcnn_adaclip
tags: {}
