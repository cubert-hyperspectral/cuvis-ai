metadata:
  name: swir_liquids_npy_infer
  description: >
    Inference pipeline for SWIR liquids classification using Spectral Angle Mapper.
    The reference spectral signatures for each liquid class are stored in the
    NpyReader buffer (file_path: null) and restored from the companion .pt file.
    No external .npy file is required at inference time.
  tags:
    - sam
    - statistical
    - material_classification
    - swir_liquids
  author: cuvis.ai

nodes:
  - name: cu3s_data
    class_name: cuvis_ai.node.data.CU3SDataNode
    hparams: {}

  - name: reference_signatures
    class_name: cuvis_ai.node.numpy_reader.NpyReader
    hparams:
      file_path: null   # buffer is populated from .pt weights at restore time

  - name: sam
    class_name: cuvis_ai.node.spectral_angle_mapper.SpectralAngleMapper
    hparams:
      num_channels: 39   # SWIR channel count; overridden when pipeline is saved

connections:
  - source: cu3s_data.outputs.cube
    target: sam.inputs.cube
  - source: reference_signatures.outputs.data
    target: sam.inputs.spectral_signature
