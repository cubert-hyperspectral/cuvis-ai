metadata:
  name: SAM3_Point_Expansion
  description: SAM3 single-frame interactive point expansion (positive/negative points to one
    object mask) with CU3S source-domain frame mapping
  tags:
  - segmentation
  - sam3
  - point-prompt
  - rgb
  author: cuvis.ai
plugins:
- cuvis_ai_builtin
- sam3
nodes:
- name: cu3s_data
  class_name: cuvis_ai.node.data.CU3SDataNode
  hparams: {}
- name: true_rgb
  class_name: cuvis_ai.node.channel_selector.CIETristimulusRGBSelector
  hparams: {}
- name: sam3_point_expansion
  class_name: cuvis_ai_sam3.node.SAM3PointExpansion
  hparams: {}
connections:
- source: cu3s_data.outputs.cube
  target: true_rgb.inputs.cube
- source: cu3s_data.outputs.wavelengths
  target: true_rgb.inputs.wavelengths
- source: true_rgb.outputs.rgb_image
  target: sam3_point_expansion.inputs.rgb_frame
- source: cu3s_data.outputs.mesu_index
  target: sam3_point_expansion.inputs.frame_id
