metadata:
  name: SAM3_Extract_Signatures
  description: SAM3 prompt-free segment-everything -> per-object spectral-signature library (.npy)
  tags: [sam3, segment-everything, spectral-signature, library]
  author: cuvis.ai
plugins:
- cuvis_ai_builtin
- sam3
nodes:
- name: cu3s_data
  class_name: cuvis_ai.node.data.CU3SDataNode
  hparams: {}
- name: true_rgb
  class_name: cuvis_ai.node.channel_selector.CIETristimulusRGBSelector
  hparams: {}
- name: sam3
  class_name: cuvis_ai_sam3.node.SAM3SegmentEverything
  hparams: {}
- name: sig_extract
  class_name: cuvis_ai.node.spectral_extractor.SpectralSignatureExtractor
  hparams: {}
- name: sig_writer
  class_name: cuvis_ai.node.numpy_file.NumpyFeatureWriterNode
  hparams:
    output_dir: D:/tmp/turbovec_bench/signatures
    prefix: sam3_signatures
connections:
- source: cu3s_data.outputs.cube
  target: true_rgb.inputs.cube
- source: cu3s_data.outputs.wavelengths
  target: true_rgb.inputs.wavelengths
- source: true_rgb.outputs.rgb_image
  target: sam3.inputs.rgb_frame
- source: cu3s_data.outputs.mesu_index
  target: sam3.inputs.frame_id
- source: cu3s_data.outputs.cube
  target: sig_extract.inputs.cube
- source: sam3.outputs.mask
  target: sig_extract.inputs.mask
- source: sam3.outputs.object_ids
  target: sig_extract.inputs.object_ids
- source: cu3s_data.outputs.wavelengths
  target: sig_extract.inputs.wavelengths
- source: sig_extract.outputs.signatures
  target: sig_writer.inputs.features
- source: cu3s_data.outputs.mesu_index
  target: sig_writer.inputs.frame_id
