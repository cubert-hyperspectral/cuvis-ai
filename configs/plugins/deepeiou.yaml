#   https://github.com/cubert-hyperspectral/cuvis-ai-cookbook/blob/main/examples/object_tracking/deepeiou/yolo_deepeiou_reid_hsi.py

plugins:
  deepeiou:
    # path: "../../../../cuvis-ai-deepeiou/deepeiou-init"
