# TrackEval Plugin Manifest (released plugin)
#
# To use TrackEval, declare `plugins: [trackeval]` in the pipeline yaml and point
# the loader at the catalog directory that holds this manifest:
#   uv run restore-pipeline --pipeline-path <pipeline>.yaml --plugins-dir configs/plugins

plugins:
  trackeval:
    # TrackEval-based tracking metric nodes for HOTA, CLEAR, and Identity evaluation
    repo: "https://github.com/cubert-hyperspectral/cuvis-ai-trackeval.git"
    tag: "v0.1.2"
    provides:
    - class_name: cuvis_ai_trackeval.node.HOTAMetricNode
      category: metric
      tags: [bbox, evaluation, numpy, tracking]
      icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#C9615A\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\r\n  <path d=\"M10 14v40h44\"/>\r\n  <rect x=\"16\" y=\"38\" width=\"8\" height=\"12\"/>\r\n  <rect x=\"28\" y=\"28\" width=\"8\" height=\"22\"/>\r\n  <rect x=\"40\" y=\"18\" width=\"8\" height=\"32\"/>\r\n</svg>\r\n"
      input_specs:
        frame_id:
          dtype: int64
          shape: [1]
          optional: false
          description: ''
        pred_frame_id:
          dtype: int64
          shape: [1]
          optional: true
          description: ''
        gt_bboxes:
          dtype: float32
          shape: [1, -1, 4]
          optional: false
          description: ''
        gt_track_ids:
          dtype: int64
          shape: [1, -1]
          optional: false
          description: ''
        pred_bboxes:
          dtype: float32
          shape: [1, -1, 4]
          optional: false
          description: ''
        pred_track_ids:
          dtype: int64
          shape: [1, -1]
          optional: false
          description: ''
        pred_scores:
          dtype: float32
          shape: [1, -1]
          optional: true
          description: ''
      output_specs:
        hota:
          dtype: float32
          shape: [1]
          optional: false
          description: Mean HOTA
        deta:
          dtype: float32
          shape: [1]
          optional: false
          description: Mean DetA
        assa:
          dtype: float32
          shape: [1]
          optional: false
          description: Mean AssA
        loca:
          dtype: float32
          shape: [1]
          optional: false
          description: Mean LocA
      doc_summary: Accumulate per-frame tracking data and compute HOTA in finalize().
    - class_name: cuvis_ai_trackeval.node.CLEARMetricNode
      category: metric
      tags: [bbox, evaluation, numpy, tracking]
      icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#C9615A\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\r\n  <path d=\"M10 14v40h44\"/>\r\n  <rect x=\"16\" y=\"38\" width=\"8\" height=\"12\"/>\r\n  <rect x=\"28\" y=\"28\" width=\"8\" height=\"22\"/>\r\n  <rect x=\"40\" y=\"18\" width=\"8\" height=\"32\"/>\r\n</svg>\r\n"
      input_specs:
        frame_id:
          dtype: int64
          shape: [1]
          optional: false
          description: ''
        pred_frame_id:
          dtype: int64
          shape: [1]
          optional: true
          description: ''
        gt_bboxes:
          dtype: float32
          shape: [1, -1, 4]
          optional: false
          description: ''
        gt_track_ids:
          dtype: int64
          shape: [1, -1]
          optional: false
          description: ''
        pred_bboxes:
          dtype: float32
          shape: [1, -1, 4]
          optional: false
          description: ''
        pred_track_ids:
          dtype: int64
          shape: [1, -1]
          optional: false
          description: ''
      output_specs:
        mota:
          dtype: float32
          shape: [1]
          optional: false
          description: MOTA
        motp:
          dtype: float32
          shape: [1]
          optional: false
          description: MOTP
        fp:
          dtype: int64
          shape: [1]
          optional: false
          description: False positives
        fn:
          dtype: int64
          shape: [1]
          optional: false
          description: False negatives
        idsw:
          dtype: int64
          shape: [1]
          optional: false
          description: ID switches
      doc_summary: Accumulate per-frame tracking data and compute CLEAR metrics in finalize().
    - class_name: cuvis_ai_trackeval.node.IdentityMetricNode
      category: metric
      tags: [bbox, evaluation, numpy, tracking]
      icon_svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"#C9615A\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\r\n  <path d=\"M10 14v40h44\"/>\r\n  <rect x=\"16\" y=\"38\" width=\"8\" height=\"12\"/>\r\n  <rect x=\"28\" y=\"28\" width=\"8\" height=\"22\"/>\r\n  <rect x=\"40\" y=\"18\" width=\"8\" height=\"32\"/>\r\n</svg>\r\n"
      input_specs:
        frame_id:
          dtype: int64
          shape: [1]
          optional: false
          description: ''
        pred_frame_id:
          dtype: int64
          shape: [1]
          optional: true
          description: ''
        gt_bboxes:
          dtype: float32
          shape: [1, -1, 4]
          optional: false
          description: ''
        gt_track_ids:
          dtype: int64
          shape: [1, -1]
          optional: false
          description: ''
        pred_bboxes:
          dtype: float32
          shape: [1, -1, 4]
          optional: false
          description: ''
        pred_track_ids:
          dtype: int64
          shape: [1, -1]
          optional: false
          description: ''
      output_specs:
        idf1:
          dtype: float32
          shape: [1]
          optional: false
          description: IDF1
        idp:
          dtype: float32
          shape: [1]
          optional: false
          description: IDP
        idr:
          dtype: float32
          shape: [1]
          optional: false
          description: IDR
      doc_summary: Accumulate per-frame tracking data and compute ID metrics in finalize().
